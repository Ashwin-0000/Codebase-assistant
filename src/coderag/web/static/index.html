<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeRAG — Codebase AI Assistant</title>
  <meta name="description" content="Ask natural-language questions about any codebase. Answers are grounded in the actual source code with file and line citations." />
  <meta name="theme-color" content="#08080f" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
<div class="app-shell" id="app">

  <!-- ── Sidebar ───────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <polygon points="12,2 22,7 22,17 12,22 2,17 2,7"
                   fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="logo-text">Code<span class="logo-accent">RAG</span></span>
    </div>

    <!-- ── Index Status ── -->
    <div class="sidebar-section" id="section-status">
      <div class="section-header">
        <span class="section-icon" aria-hidden="true">◉</span>
        <h3>Index Status</h3>
        <button class="icon-btn" id="refresh-status" title="Refresh status" aria-label="Refresh index status">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>
      <div class="status-widget" id="status-widget">
        <div class="skeleton-block">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
    </div>

    <!-- ── Index Repo ── -->
    <div class="sidebar-section">
      <div class="section-header">
        <span class="section-icon" aria-hidden="true">⊕</span>
        <h3>Index Repository</h3>
      </div>
      <form class="index-form" id="index-form" novalidate>
        <input
          type="text"
          id="repo-input"
          class="form-input"
          placeholder="/path/to/repo  or  github.com/org/repo"
          autocomplete="off"
          spellcheck="false"
          aria-label="Repository path or URL"
        />
        <label class="checkbox-label">
          <input type="checkbox" id="force-reindex" />
          <span>Force full re-index</span>
        </label>
        <button type="submit" class="btn btn-primary" id="index-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="21 15 21 21 3 21 3 15"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Index Repository
        </button>
      </form>

      <!-- Progress -->
      <div class="progress-box hidden" id="index-progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="progress-text" id="progress-text">Initialising…</p>
      </div>
    </div>

    <!-- ── Settings ── -->
    <div class="sidebar-section">
      <div class="section-header">
        <span class="section-icon" aria-hidden="true">⚙</span>
        <h3>Settings</h3>
      </div>
      <div class="setting-row">
        <label for="top-k">Top-K results</label>
        <input type="number" id="top-k" class="form-input narrow"
               value="8" min="1" max="50" aria-label="Top K retrieval results" />
      </div>
    </div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <a href="/api/docs" target="_blank" rel="noopener" class="footer-link">API&nbsp;Docs</a>
      <span class="footer-sep">·</span>
      <a href="https://github.com/your-org/coderag" target="_blank" rel="noopener" class="footer-link">GitHub</a>
    </div>

  </aside><!-- /sidebar -->

  <!-- ── Chat Area ─────────────────────────────────────────────────── -->
  <main class="chat-area" id="chat-area" role="main">

    <!-- Header -->
    <div class="chat-header">
      <button class="icon-btn sidebar-toggle" id="sidebar-toggle"
              aria-label="Toggle sidebar" aria-expanded="false"
              aria-controls="sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="chat-header-center">
        <h1>Ask about your codebase</h1>
        <p>Semantic search · call-graph expansion · citation-grounded answers</p>
      </div>

      <div class="chat-header-right">
        <span class="model-chip" id="model-chip" title="Active providers">–</span>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation">
      <!-- Injected by JS -->
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <div class="input-wrapper" id="input-wrapper">
        <textarea
          id="question-input"
          class="question-textarea"
          placeholder="Ask a question about your codebase…"
          rows="1"
          autocomplete="off"
          spellcheck="false"
          aria-label="Your question"
          aria-multiline="true"
        ></textarea>
        <button class="send-btn" id="ask-btn" type="button" disabled
                title="Send (Enter)" aria-label="Send question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22,2 15,22 11,13 2,9"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">
        <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for newline
      </p>
    </div>

  </main><!-- /chat-area -->

</div><!-- /app-shell -->

<script src="/static/app.js"></script>
</body>
</html>
